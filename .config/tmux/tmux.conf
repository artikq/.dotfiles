set-option -sa terminal-overrides ',xterm-256color:RGB'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g allow-passthrough on

set -g prefix ^B
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows off       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

# General statusline customisation
set -g status-style 'bg=terminal'
 
setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# TODO check stuff below
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'catppuccin/tmux'


# Configure Catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
set -g @STATUS_BG_COLOR "#181824"

# status right look and feel
set -g status-right-length 100
set -g status-right ""

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Configure Tmux
set -g status-position bottom
set -g status-style "bg=#{@STATUS_BG_COLOR}"
set -g status-justify "absolute-centre"

# window look and feel
# set -wg automatic-rename off
# claude runs as a versioned binary (e.g. 2.1.322); its session name lives in the pane title
set -g automatic-rename-format '#{?#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}},#{=/32/…:pane_title},#{pane_current_command}}'

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@STATUS_BG_COLOR},fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=#{@STATUS_BG_COLOR},fg=#{@thm_rosewater}"
set -g window-status-activity-style "bg=#{@thm_rosewater},fg=#{@STATUS_BG_COLOR}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@STATUS_BG_COLOR},bold"
set -gF window-status-separator "#[bg=#{@STATUS_BG_COLOR},fg=#{@thm_overlay_0}]│"

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_rosewater},fg=#{@STATUS_BG_COLOR},bold"



set -g focus-events on
set -g status-style bg=default
set -g status-left '#(cat #{socket_path}-\#{session_id}-vimbridge)'
set -g status-left-length 99
set -g status-right '#(cat #{socket_path}-\#{session_id}-vimbridge-R)'
set -g status-right-length 99

bind-key -r f run-shell "tmux neww tmux-sessionizer"

# PageUp enters scroll mode; full-screen apps (nvim, less) still get the key
bind -n PPage if -F '#{alternate_on}' 'send-keys PPage' 'copy-mode -e ; send -X halfpage-up'
bind -T copy-mode-vi PPage send -X halfpage-up
bind -T copy-mode-vi NPage send -X halfpage-down

# vim-like selection: v = by character, C-v = block
bind -T copy-mode-vi v send -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-on

# vim-like text objects: iw aw iW aW i" a" i' a' i` a` i( a( ib ab i[ a[ i{ a{ iB aB i< a<
# shortcut: quotes/brackets are found on the current line only, no nesting
bind -T copy-mode-vi i switch-client -T copy-obj-i
bind -T copy-mode-vi a switch-client -T copy-obj-a
bind -T copy-obj-i w send -X select-word
bind -T copy-obj-a w send -X select-word
bind -T copy-obj-i W set word-separators ' ' \; send -X select-word \; set -u word-separators
bind -T copy-obj-a W set word-separators ' ' \; send -X select-word \; set -u word-separators
bind -T copy-obj-i '"' send -X jump-to-backward '"' \; send -X begin-selection \; send -X jump-to-forward '"'
bind -T copy-obj-a '"' send -X jump-backward '"' \; send -X begin-selection \; send -X jump-forward '"'
bind -T copy-obj-i "'" send -X jump-to-backward "'" \; send -X begin-selection \; send -X jump-to-forward "'"
bind -T copy-obj-a "'" send -X jump-backward "'" \; send -X begin-selection \; send -X jump-forward "'"
bind -T copy-obj-i '`' send -X jump-to-backward '`' \; send -X begin-selection \; send -X jump-to-forward '`'
bind -T copy-obj-a '`' send -X jump-backward '`' \; send -X begin-selection \; send -X jump-forward '`'
bind -T copy-obj-i ( send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-obj-a ( send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-obj-i ) send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-obj-a ) send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-obj-i b send -X jump-to-backward ( \; send -X begin-selection \; send -X jump-to-forward )
bind -T copy-obj-a b send -X jump-backward ( \; send -X begin-selection \; send -X jump-forward )
bind -T copy-obj-i [ send -X jump-to-backward [ \; send -X begin-selection \; send -X jump-to-forward ]
bind -T copy-obj-a [ send -X jump-backward [ \; send -X begin-selection \; send -X jump-forward ]
bind -T copy-obj-i ] send -X jump-to-backward [ \; send -X begin-selection \; send -X jump-to-forward ]
bind -T copy-obj-a ] send -X jump-backward [ \; send -X begin-selection \; send -X jump-forward ]
bind -T copy-obj-i \{ send -X jump-to-backward \{ \; send -X begin-selection \; send -X jump-to-forward \}
bind -T copy-obj-a \{ send -X jump-backward \{ \; send -X begin-selection \; send -X jump-forward \}
bind -T copy-obj-i \} send -X jump-to-backward \{ \; send -X begin-selection \; send -X jump-to-forward \}
bind -T copy-obj-a \} send -X jump-backward \{ \; send -X begin-selection \; send -X jump-forward \}
bind -T copy-obj-i B send -X jump-to-backward \{ \; send -X begin-selection \; send -X jump-to-forward \}
bind -T copy-obj-a B send -X jump-backward \{ \; send -X begin-selection \; send -X jump-forward \}
bind -T copy-obj-i < send -X jump-to-backward < \; send -X begin-selection \; send -X jump-to-forward >
bind -T copy-obj-a < send -X jump-backward < \; send -X begin-selection \; send -X jump-forward >
bind -T copy-obj-i > send -X jump-to-backward < \; send -X begin-selection \; send -X jump-to-forward >
bind -T copy-obj-a > send -X jump-backward < \; send -X begin-selection \; send -X jump-forward >

# Claude: list of Claude windows across sessions
bind a choose-tree -Zw -f '#{m/r:^(claude|[0-9]+\.[0-9]+\.[0-9]+)$,#{pane_current_command}}'
# Claude: toggle a per-session popup; the conversation survives hiding it
bind A if -F '#{m:popup-*,#{session_name}}' 'detach-client' 'display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "TMUX= tmux new-session -A -s popup-#{session_name} claude"'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Russian layout: Ctrl+И as a second prefix, and every binding mirrored onto Cyrillic keys
set -g prefix2 C-и
run 'python3 -I ~/.config/tmux/ru-keys.py'
